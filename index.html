<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.png" />
    <meta name="theme-color" content="#121212" />
    <title>После 40 — пространство для тех, кто ищет себя</title>
    <meta name="description" content="Почему после 40 не поздно — пространство поддержки и самопознания для женщин. Книга, интерактивы, дневник." />
    <meta property="og:title" content="После 40 — пространство для тех, кто ищет себя" />
    <meta property="og:description" content="Книга, интерактивное пространство и поддержка для женщин, которые ищут новый путь после 40." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Preloader styles — inline to show before JS loads */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: hsl(0 0% 7%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Noise grain */
      #preloader::before {
        content: '';
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
        opacity: 0.4;
        pointer-events: none;
      }

      /* Scanline */
      #preloader::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          hsl(0 0% 0% / 0.03) 2px,
          hsl(0 0% 0% / 0.03) 4px
        );
        pointer-events: none;
      }

      /* Glitch text */
      .preloader-title {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-size: clamp(2rem, 6vw, 4.5rem);
        font-weight: 700;
        color: hsl(40 20% 93%);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        position: relative;
        z-index: 2;
        animation: glitch-text 3s infinite;
      }

      .preloader-sub {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: hsl(24 100% 50%);
        margin-top: 1.5rem;
        z-index: 2;
        animation: flicker 2s ease-in-out infinite;
      }

      /* Progress bar */
      .preloader-bar {
        width: 120px;
        height: 2px;
        background: hsl(0 0% 25%);
        margin-top: 2rem;
        position: relative;
        z-index: 2;
        overflow: hidden;
      }
      .preloader-bar::after {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: hsl(24 100% 50%);
        animation: bar-fill 2s ease-in-out forwards;
      }

      /* Decorative lines */
      .preloader-line {
        position: absolute;
        background: hsl(24 100% 50% / 0.15);
        z-index: 1;
      }
      .preloader-line-h {
        width: 100%;
        height: 1px;
        left: 0;
        animation: slide-h 4s linear infinite;
      }
      .preloader-line-v {
        height: 100%;
        width: 1px;
        top: 0;
        animation: slide-v 5s linear infinite;
      }

      @keyframes glitch-text {
        0%, 90%, 100% { transform: translate(0); text-shadow: none; }
        92% { transform: translate(-3px, 1px); text-shadow: 2px 0 hsl(24 100% 50% / 0.6), -2px 0 hsl(200 100% 50% / 0.3); }
        94% { transform: translate(2px, -1px); text-shadow: -2px 0 hsl(24 100% 50% / 0.6), 2px 0 hsl(200 100% 50% / 0.3); }
        96% { transform: translate(0); text-shadow: none; }
      }

      @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      @keyframes bar-fill {
        0% { width: 0%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }

      @keyframes slide-h {
        0% { transform: translateY(-100vh); }
        100% { transform: translateY(100vh); }
      }

      @keyframes slide-v {
        0% { transform: translateX(-100vw); }
        100% { transform: translateX(100vw); }
      }
    </style>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader">
      <div class="preloader-line preloader-line-h" style="top: 30%"></div>
      <div class="preloader-line preloader-line-h" style="top: 70%; animation-delay: -2s;"></div>
      <div class="preloader-line preloader-line-v" style="left: 25%; animation-delay: -1s;"></div>
      <div class="preloader-line preloader-line-v" style="left: 75%; animation-delay: -3s;"></div>
      <div class="preloader-title">После 40</div>
      <div class="preloader-sub">пространство открывается</div>
      <div class="preloader-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
